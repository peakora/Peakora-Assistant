name = "peakora-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "peakora-db"
database_id = "b2036427-fc76-4b5c-b989-58439f8ca2f5"

# KV namespace for auth sessions
[[kv_namespaces]]
binding = "AUTH"
id = "5e3516b101da423f919aae4c77111511"

# Secrets (set via: npx wrangler secret put NAME)
# DODO_PAYMENTS_WEBHOOK_SECRET — Standard Webhooks signing secret
# ADMIN_TOKEN — protects admin endpoints (also accepted: signed-in admin partner)
# GOOGLE_CLIENT_SECRET — Google OAuth client secret (for Google sign-in)
# RESEND_API_KEY — Resend API key for the self-hosted email sequence engine.
#                  The FROM address (hello@peakora.life) must be on a verified
#                  Resend domain. Without this key the sequence silently no-ops.

# Non-secret env vars (set directly here or via dashboard)
[vars]
DODO_MONTHLY_PRODUCT_ID = "pdt_0Nly8uZGIn2kDXKM1Lpit"
DODO_YEARLY_PRODUCT_ID = "pdt_0Nly8uRkxK0Fkfg3SSu5B"
DODO_MONTHLY_PAYMENT_LINK = "https://checkout.dodopayments.com/buy/pdt_0Nly8uZGIn2kDXKM1Lpit?quantity=1"
DODO_YEARLY_PAYMENT_LINK = "https://checkout.dodopayments.com/buy/pdt_0Nly8uRkxK0Fkfg3SSu5B?quantity=1"
DODO_ENVIRONMENT = "live_mode"
APP_PUBLIC_URL = "https://peakora-assistant.pages.dev"
APP_PUBLIC_URL_API = "https://peakora-api.peakora.workers.dev"
GOOGLE_CLIENT_ID = "136973395826-ef90gdu365rdhssnv0g07g7medm65dki.apps.googleusercontent.com"

# Secrets (set via: npx wrangler secret put NAME)
# VAPID_PUBLIC_KEY  — Web Push public key (also safe to expose; returned by /push-key)
# VAPID_PRIVATE_KEY — Web Push private key (hex), used to sign VAPID JWTs

# Daily gentle nudge to all subscribed devices.
[triggers]
crons = ["0 9 * * *"]
